spring.application.name=pulse

# Supabase PostgreSQL Connection
# Set your environment variables or replace the placeholders directly below:
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate PostgreSQL Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080

spring.sql.init.mode=always