spring.application.name=pulse
spring.config.import=optional:file:.env.local[.properties]

# Supabase PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.wwxrvjzbhgyptpigkdsr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supavisor session pooler (port 5432) can report an undefined isolation level
# through the pooled connection. Set the application isolation explicitly so
# HikariCP does not attempt to apply an invalid -1 value.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# JPA / Hibernate PostgreSQL Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
logging.level.root=INFO
# Hibernate 7 reports explicit dialect configuration as informational deprecation;
# keep application logs focused on actionable warnings/errors.
logging.level.org.hibernate.orm.deprecation=ERROR

# Email / SMTP
# Set these environment variables before starting P.U.L.S.E to enable real email delivery.
spring.mail.host=${PULSE_MAIL_HOST:}
spring.mail.port=${PULSE_MAIL_PORT:587}
spring.mail.username=${PULSE_MAIL_USERNAME:}
spring.mail.password=${PULSE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
pulse.mail.from=${PULSE_MAIL_FROM:${PULSE_MAIL_USERNAME:}}
pulse.app.base-url=${PULSE_BASE_URL:http://localhost:8080}

# Railway endpoint used by the local instance for dynamic LAN registration
pulse.cloud-url=${PULSE_CLOUD_URL:https://pulse-production-096d.up.railway.app}

# Optional free CARTO Basemaps key. When absent, the frontend falls back to OpenStreetMap tiles.
pulse.map.carto-key=${PULSE_CARTO_MAP_KEY:}
