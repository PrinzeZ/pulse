<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>P.U.L.S.E — Staff Stock Management</title>

    <link rel="stylesheet" th:href="@{/css/pulse.css}">
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>

<body class="user-page">

    <div class="win95-window">

        <!-- TITLE BAR -->
        <div class="title-bar">

            <div class="title-bar-text">
                P.U.L.S.E — Staff Inventory Panel
            </div>

            <div class="title-bar-controls">
                <button>×</button>
            </div>

        </div>


        <!-- MENU BAR -->
        <nav class="menu-bar">

            <a class="active">
                Stock Management
            </a>

            <a th:href="@{/logout}">
                Logout
            </a>

            <span class="team-info">
                STAFF MODE
            </span>

        </nav>


        <!-- MAIN CONTENT -->
        <main class="user-body" style="padding: 24px;">

            <h2 style="color: #0040C0;">
                LOCAL HOSPITAL INVENTORY
            </h2>

            <p style="font-size: 12px; margin-bottom: 16px;">
                Manage local medicine counts and supplies.
            </p>


            <!-- STOCK TABLE -->
            <table>

                <thead>

                    <tr>

                        <th>
                            Medicine
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Available Quantity
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <!--
                This row is repeated for every stock entry
                received from the database.
            -->
                    <tr th:each="stock : ${stockEntries}">

                        <!-- MEDICINE NAME -->
                        <td th:text="${medicines[stock.medId].name}">
                            Medicine Name
                        </td>


                        <!-- MEDICINE CATEGORY -->
                        <td th:text="${medicines[stock.medId].cat}">
                            Category
                        </td>


                        <!-- UPDATE STOCK FORM -->
                        <td>

                            <form th:action="@{/staff/stock/update}" method="post">

                                <input type="hidden" name="entryId" th:value="${stock.entryId}">

                                <input type="number" name="quantity" th:value="${stock.quantity}" min="0" required
                                    style="width: 80px;">

                                <span>
                                    units
                                </span>

                        </td>


                        <!-- UPDATE BUTTON -->
                        <td>

                            <button type="submit" class="btn">
                                Update Stock
                            </button>

                            </form>

                        </td>

                    </tr>


                    <!-- EMPTY STOCK MESSAGE -->
                    <tr th:if="${#lists.isEmpty(stockEntries)}">

                        <td colspan="4">

                            No stock entries found.

                        </td>

                    </tr>

                </tbody>

            </table>

        </main>


        <!-- STATUS BAR -->
        <div class="status-bar">

            <div class="status-bar-field">

                Status: Staff Logged In

            </div>

        </div>

    </div>

</body>

</html>
