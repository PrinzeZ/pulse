<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/svg+xml" th:href="@{/images/branding/pulse-mark.svg}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>P.U.L.S.E — Access denied</title><link rel="stylesheet" th:href="@{/css/pulse.css}">
<style>
.denied-page{min-height:100vh;display:grid;place-items:center;background:#f4f8fb;padding:22px}.denied-card{width:min(900px,100%);display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:center;background:#fff;border:1px solid #d9e3ea;border-radius:18px;padding:34px;box-shadow:0 18px 55px rgba(18,51,77,.1)}.denied-art{height:300px;display:grid;place-items:center;background:linear-gradient(145deg,#f8fafc,#fff7f9);border:1px solid #e2eaf0;border-radius:14px;overflow:hidden}.denied-copy h1{font-size:42px;color:#123e60;margin:8px 0}.denied-copy p{color:#6c7d8d;line-height:1.65}.denied-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.denied-bot{width:220px;height:250px;position:relative;animation:deniedFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(18,62,96,.12))}.db-head{position:absolute;left:51px;top:9px;width:118px;height:82px;border:4px solid #173d5a;border-radius:44% 44% 42% 42%;background:linear-gradient(145deg,#fff,#edf3f7)}.db-eye{position:absolute;top:31px;width:13px;height:13px;border-radius:50%;background:#172c3d}.db-eye.l{left:28px}.db-eye.r{right:28px}.db-mouth{position:absolute;left:41px;right:41px;top:39px;height:4px;background:#172c3d;border-radius:99px;transform:rotate(12deg)}.db-body{position:absolute;left:38px;top:84px;width:144px;height:119px;border:4px solid #173d5a;border-radius:42% 42% 31% 31%;background:linear-gradient(155deg,#fff,#e9f0f5)}.db-chest{position:absolute;left:24px;right:24px;top:29px;height:58px;border-radius:24px;background:rgba(255,126,154,.10);border:2px solid rgba(255,126,154,.38);overflow:hidden}.db-chest svg{width:100%;height:100%;padding:10px 5px}.db-chest polyline{fill:none;stroke:#ff6f91;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;animation:deniedEcg 1.4s linear infinite}.db-arm{position:absolute;top:99px;width:43px;height:101px;border:4px solid #173d5a;border-radius:45% 45% 50% 50%;background:linear-gradient(145deg,#fff,#eaf1f5)}.db-arm.l{left:3px;transform:rotate(16deg)}.db-arm.r{right:-7px;transform:rotate(-42deg);transform-origin:top center}.db-arm.r:after{content:"";position:absolute;width:30px;height:30px;border:4px solid #173d5a;border-radius:50%;background:#fff;right:-19px;bottom:-13px;transform:rotate(20deg)}.db-leg{position:absolute;top:194px;width:49px;height:48px;border:4px solid #173d5a;border-radius:15px 15px 45% 45%;background:#fff}.db-leg.l{left:61px}.db-leg.r{right:61px}.db-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ff6f91;box-shadow:0 0 0 5px rgba(255,111,145,.12);animation:deniedSpark 1.4s ease-in-out infinite}.db-spark.one{right:13px;top:80px}.db-spark.two{left:12px;top:170px;animation-delay:.35s}@keyframes deniedFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1deg)}}@keyframes deniedEcg{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}@keyframes deniedSpark{0%,100%{transform:scale(.65);opacity:.3}50%{transform:scale(1.2);opacity:1}}@media(max-width:700px){.denied-card{grid-template-columns:1fr;padding:22px}.denied-art{height:270px}}
</style></head>
<body><main class="denied-page"><section class="denied-card"><div class="denied-art" aria-hidden="true"><div class="denied-bot"><div class="db-head"><span class="db-eye l"></span><span class="db-eye r"></span><span class="db-mouth"></span></div><div class="db-body"><div class="db-chest"><svg viewBox="0 0 220 52" preserveAspectRatio="none"><polyline points="0,27 37,27 53,27 67,27 80,7 94,46 108,27 145,27 162,27 175,17 187,37 199,27 220,27"/></svg></div></div><span class="db-arm l"></span><span class="db-arm r"></span><span class="db-leg l"></span><span class="db-leg r"></span><span class="db-spark one"></span><span class="db-spark two"></span></div></div><div class="denied-copy"><div class="eyebrow">ZERO-TRUST ACCESS CONTROL</div><h1>403 · Access denied</h1><p>Your account is authenticated, but this resource is outside the role or organizational scope assigned to your account.</p><div class="denied-actions"><a class="btn btn-primary" th:href="@{/menu}">Return to dashboard</a><a class="btn" th:href="@{/}">P.U.L.S.E home</a><form th:action="@{/logout}" method="post"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="btn" type="submit">Sign out</button></form></div></div></section></main><script th:src="@{/js/pulse-ui.js}"></script></body></html>
