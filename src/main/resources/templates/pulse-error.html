<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/svg+xml" th:href="@{/images/branding/pulse-mark.svg}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>P.U.L.S.E — Error</title><link rel="stylesheet" th:href="@{/css/pulse.css}">
<style>
.pulse-error-page{min-height:100vh;display:grid;place-items:center;background:#f4f8fb;padding:22px}.pulse-error-card{width:min(980px,100%);display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center;background:#fff;border:1px solid #d9e3ea;border-radius:18px;padding:34px;box-shadow:0 18px 55px rgba(18,51,77,.1)}.pulse-error-art{height:330px;display:grid;place-items:center;background:linear-gradient(145deg,#f8fafc,#fff7f9);border:1px solid #e2eaf0;border-radius:14px;overflow:hidden}.pulse-error-copy h1{font-size:54px;color:#123e60;margin:8px 0}.pulse-error-copy h2{font-size:21px;color:#17324d;margin:0 0 8px}.pulse-error-copy p{color:#6c7d8d;line-height:1.7}.pulse-error-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.pulse-error-code{display:inline-block;margin-top:14px;padding:7px 10px;border-radius:7px;background:#edf4f8;color:#557087;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}
.error-bot{width:250px;height:285px;position:relative;animation:errorBotFloat 3s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(18,62,96,.12))}.eb-head{position:absolute;left:58px;top:9px;width:134px;height:92px;border:4px solid #173d5a;border-radius:44% 44% 42% 42%;background:linear-gradient(145deg,#fff,#e9f0f5);transform:rotate(-4deg)}.eb-eye{position:absolute;top:34px;width:13px;height:13px;border-radius:50%;background:#172c3d}.eb-eye.l{left:30px}.eb-eye.r{right:30px}.eb-mouth{position:absolute;left:45px;right:45px;top:43px;height:4px;background:#172c3d;border-radius:99px;transform:rotate(12deg)}.eb-body{position:absolute;left:43px;top:98px;width:164px;height:133px;border:4px solid #173d5a;border-radius:42% 42% 31% 31%;background:linear-gradient(155deg,#fff,#e9f0f5)}.eb-chest{position:absolute;left:27px;right:27px;top:32px;height:65px;border-radius:25px;background:rgba(255,126,154,.10);border:2px solid rgba(255,126,154,.38);overflow:hidden}.eb-chest svg{width:100%;height:100%;padding:11px 5px}.eb-chest polyline{fill:none;stroke:#ff6f91;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:280;animation:errorEcg 1.3s linear infinite}.eb-arm{position:absolute;top:110px;width:48px;height:108px;border:4px solid #173d5a;border-radius:45% 45% 50% 50%;background:linear-gradient(145deg,#fff,#eaf1f5)}.eb-arm.l{left:5px;transform:rotate(20deg)}.eb-arm.r{right:-7px;transform:rotate(-48deg);transform-origin:top center}.eb-arm.r:after{content:"";position:absolute;right:-23px;bottom:-15px;width:34px;height:34px;border:4px solid #173d5a;border-radius:50%;background:#fff}.eb-leg{position:absolute;top:221px;width:54px;height:53px;border:4px solid #173d5a;border-radius:15px 15px 45% 45%;background:#fff}.eb-leg.l{left:70px}.eb-leg.r{right:70px}.eb-part{position:absolute;width:26px;height:12px;border:4px solid #173d5a;border-radius:9px;background:#fff;right:9px;top:190px;transform:rotate(27deg);animation:errorPart 1.8s ease-in-out infinite}.eb-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ff6f91;box-shadow:0 0 0 5px rgba(255,111,145,.12);animation:errorSpark 1.25s ease-in-out infinite}.eb-spark.one{right:14px;top:85px}.eb-spark.two{left:13px;top:190px;animation-delay:.3s}@keyframes errorBotFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-1deg)}}@keyframes errorEcg{from{stroke-dashoffset:280}to{stroke-dashoffset:0}}@keyframes errorPart{0%,100%{transform:translate(0,0) rotate(27deg)}50%{transform:translate(10px,-12px) rotate(42deg)}}@keyframes errorSpark{0%,100%{transform:scale(.6);opacity:.25}50%{transform:scale(1.3);opacity:1}}@media(max-width:700px){.pulse-error-card{grid-template-columns:1fr;padding:24px}.pulse-error-art{height:290px}.pulse-error-copy h1{font-size:42px}}
</style></head>
<body><main class="pulse-error-page"><section class="pulse-error-card"><div class="pulse-error-art" aria-hidden="true"><div class="error-bot"><div class="eb-head"><span class="eb-eye l"></span><span class="eb-eye r"></span><span class="eb-mouth"></span></div><div class="eb-body"><div class="eb-chest"><svg viewBox="0 0 220 52" preserveAspectRatio="none"><polyline points="0,27 37,27 53,27 67,27 80,7 94,46 108,27 145,27 162,27 175,17 187,37 199,27 220,27"/></svg></div></div><span class="eb-arm l"></span><span class="eb-arm r"></span><span class="eb-leg l"></span><span class="eb-leg r"></span><span class="eb-part"></span><span class="eb-spark one"></span><span class="eb-spark two"></span></div></div><div class="pulse-error-copy"><div class="eyebrow">P.U.L.S.E route protection</div><h1 th:text="${errorStatus ?: 404}">404</h1><h2 th:text="${(errorStatus ?: 404) == 404 ? 'This route fell apart.' : 'Something went wrong.'}">This route fell apart.</h2><p>The address is not available in this P.U.L.S.E workspace, or this HTTP method is not supported here. The security boundary is still intact.</p><span class="pulse-error-code">HTTP <span th:text="${errorStatus ?: 404}">404</span></span><div class="pulse-error-actions"><a class="btn btn-primary" th:href="@{/menu}">Return to dashboard</a><a class="btn" th:href="@{/}">P.U.L.S.E home</a></div></div></section></main><script th:src="@{/js/pulse-ui.js}"></script></body></html>
