local.datasource.url=jdbc:h2:file:./data/local-hospital-cache
local.datasource.driver-class-name=org.h2.Driver
local.datasource.username=sa
local.datasource.password=

spring.sql.init.mode=never
pulse.sync.initial-delay-ms=15000
pulse.sync.fixed-delay-ms=60000

# Local/offline mode: PostgreSQL is optional at runtime.
# These Hikari settings are now bound directly to the custom PostgreSQL datasource.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.jpa.open-in-view=false
pulse.cloud.ddl-auto=none
